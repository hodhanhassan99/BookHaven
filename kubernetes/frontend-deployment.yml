apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookhaven-frontend
  labels:
    app: bookhaven
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookhaven
      component: frontend
  template:
    metadata:
      labels:
        app: bookhaven
        component: frontend
    spec:
      containers:
        - name: frontend
          image: hodhan/bookhaven-frontend:v1.0.3
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
