apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookhaven-backend
  labels:
    app: bookhaven
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookhaven
      component: backend
  template:
    metadata:
      labels:
        app: bookhaven
        component: backend
    spec:
      containers:
        - name: backend
          image: hodhan/bookhaven-backend:v1.0.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/books
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/books
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/bookhaven"
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
